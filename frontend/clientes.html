<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - 2Q Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Unificación de fuente */
        body, h2, h3, label, input, button, table {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        /* Estilo para la tabla de listado */
        .tabla-clientes {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .tabla-clientes th, .tabla-clientes td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .tabla-clientes th {
            background-color: #f8f9fa;
            color: #0056b3;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .tabla-clientes tr:hover {
            background-color: #f0f4ff;
        }

        .form-container {
            max-width: 850px;
            margin-bottom: 30px;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* BUSCADOR REDONDEADO */
        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            align-items: center;
            max-width: 600px;
        }
        
        #inputBusqueda {
            border-radius: 25px; 
            padding: 10px 20px;
            border: 1px solid #ced4da;
            flex-grow: 1;
            transition: 0.3s;
            height: 45px;
        }
        
        #inputBusqueda:focus {
            border-color: #0056b3;
            box-shadow: 0 0 0 0.2rem rgba(0,86,179,0.15);
            outline: none;
        }

        /* BOTÓN LIMPIAR - AHORA EN ROJO OUTLINE */
        .btn-limpiar {
            border-radius: 20px;
            padding: 0 20px;
            font-size: 0.85rem;
            font-weight: 700;
            background-color: white !important;
            color: #dc3545 !important;
            border: 2px solid #dc3545 !important;
            height: 35px;
            line-height: 32px;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-limpiar:hover {
            background-color: #dc3545 !important;
            color: white !important;
        }

        #btnGuardar {
            background-color: #0056b3;
            color: white;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            transition: 0.3s;
        }

        #btnGuardar:hover {
            background-color: #004494;
        }
    </style>
</head>
<body class="dashboard">

    <div class="content">
        <h2 class="text-center mb-4 fw-bold" style="color: #1a252f;">Gestión de Clientes</h2>

        <div class="form-container mx-auto">
            <h3><span id="formTitle" class="fw-bold" style="color: #1a252f;">Nuevo Cliente</span></h3>
            <form id="formCliente">
                <input type="hidden" id="clienteId">
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="nombre" class="fw-bold small">Nombre Completo *</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="cedula" class="fw-bold small">Cédula / RUC *</label>
                            <input type="text" id="cedula" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="telefono" class="fw-bold small">Teléfono</label>
                            <input type="text" id="telefono" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="correo" class="fw-bold small">Correo</label>
                            <input type="email" id="correo" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="direccion" class="fw-bold small">Dirección</label>
                    <textarea id="direccion" class="form-control" rows="2"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn" id="btnGuardar">Guardar Cliente</button>
                    <button type="button" class="btn btn-secondary" id="btnCancelar" style="display:none; border-radius: 8px;">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <hr class="my-5">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold" style="color: #1a252f;">Listado de Clientes</h3>
        </div>
        
        <div class="search-container">
            <input type="text" id="inputBusqueda" placeholder="Buscar por Nombre o Cédula..." onkeyup="cargarClientes()">
            <button class="btn btn-limpiar" onclick="limpiarBusqueda()">
                Limpiar
            </button>
        </div>

        <div id="listadoClientes">
            <table class="tabla-clientes">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Cédula/RUC</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th style="text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientesBody">
                    <tr><td colspan="5" class="text-center">Cargando clientes...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
