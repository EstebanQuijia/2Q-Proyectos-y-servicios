<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Alquiler - 2Q Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .resumen-container { background: white; padding: 30px; border-radius: 15px; shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .item-alquiler { border-left: 5px solid #667eea; margin-bottom: 10px; padding: 10px; background: #f8f9fa; }
        .badge-extra { background-color: #0dcaf0; color: #000; }
    </style>
</head>
<body class="dashboard">
    <div class="content">
        <div class="resumen-container">
            <h2 class="text-center mb-4">Resumen del Nuevo Alquiler</h2>
            
            <div class="row">
                <div class="col-md-5">
                    <h4>1. Datos del Cliente</h4>
                    <div class="mb-3">
                        <label class="form-label">Buscar Cliente (Nombre o Cédula)</label>
                        <input type="text" id="buscarCliente" class="form-control" placeholder="Escriba para buscar..." onkeyup="buscarClientes()">
                        <select id="selectCliente" class="form-select mt-2" size="5">
                            </select>
                    </div>
                    <div id="infoClienteSeleccionado" class="alert alert-info" style="display:none;">
                        <strong>Cliente:</strong> <span id="nombreCli"></span><br>
                        <strong>Cédula:</strong> <span id="cedulaCli"></span>
                    </div>
                    
                    <h4 class="mt-4">2. Periodo de Alquiler</h4>
                    <div class="row">
                        <div class="col-6">
                            <label class="form-label">Fecha Inicio</label>
                            <input type="date" id="fechaInicio" class="form-control">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Fecha Fin</label>
                            <input type="date" id="fechaFin" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="col-md-7">
                    <h4>3. Equipos Seleccionados</h4>
                    <div id="listaEquiposResumen">
                        </div>
                    
                    <div class="mt-4 p-3 bg-light rounded border">
                        <h5>Acciones Finales</h5>
                        <p class="small text-muted">Al finalizar, el estado de los equipos pasará a "Alquilado" y se generará el PDF.</p>
                        <button class="btn btn-success w-100 mb-2" onclick="procesarAlquiler()">
                            ✅ CONFIRMAR Y GENERAR ACTA
                        </button>
                        <a href="inventario.html" class="btn btn-outline-secondary w-100">Regresar al Inventario</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/resumen-alquiler.js"></script>
</body>
</html>
