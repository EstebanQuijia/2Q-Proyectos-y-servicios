<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Alquiler - 2Q Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Unificamos la fuente en todo el documento */
        body, h2, h4, h5, button, input, select, label {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        .resumen-container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }

        .item-alquiler { 
            border-left: 5px solid #0056b3; /* Azul Industrial */
            margin-bottom: 10px; 
            padding: 10px; 
            background: #f8f9fa; 
        }

        .badge-extra { 
            background-color: #0dcaf0; 
            color: #000; 
        }

        .search-group {
            display: flex;
            gap: 5px;
        }

        .btn-plus {
            width: 50px;
            padding: 10px 10px;
            line-height: 1;
            background-color: #0056b3 !important;
            border: none !important;
        }

        /* Estilo para los títulos de sección */
        .seccion-titulo {
            color: #0056b3;
            font-weight: bold;
        }
    </style>
</head>
<body class="dashboard">
    <div class="content">
        <div class="resumen-container">
            <h2 class="text-center mb-4 fw-bold">Resumen del Nuevo Alquiler</h2>
            
            <div class="row">
                <div class="col-md-5">
                    <h4 class="seccion-titulo">1. Datos del Cliente</h4>
                    <div class="mb-3">
                        <label class="form-label">Buscar Cliente (Nombre o Cédula)</label>
                        <div class="search-group">
                            <input type="text" id="buscarCliente" class="form-control" placeholder="Escriba para buscar..." onkeyup="buscarClientes()">
                            <button class="btn btn-primary btn-sm btn-plus fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoCliente" title="Registrar nuevo cliente">
                                +
                            </button>
                        </div>
                        <select id="selectCliente" class="form-select mt-2" size="5"></select>
                    </div>

                    <div id="infoClienteSeleccionado" class="alert alert-info py-2 shadow-sm" style="display:none; border-left: 4px solid #0056b3;">
                        <small class="d-block"><strong>Cliente:</strong> <span id="nombreCli"></span></small>
                        <small class="d-block"><strong>Cédula:</strong> <span id="cedulaCli"></span></small>
                    </div>
                    
                    <h4 class="mt-4 seccion-titulo">2. Periodo de Alquiler</h4>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label small">Fecha Inicio</label>
                            <input type="date" id="fechaInicio" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label small">Fecha Fin</label>
                            <input type="date" id="fechaFin" class="form-control form-control-sm">
                        </div>
                    </div>
                </div>

                <div class="col-md-7">
                    <h4 class="seccion-titulo">3. Equipos Seleccionados</h4>
                    <div id="listaEquiposResumen"></div>
                    
                    <div class="mt-4 p-3 bg-light rounded border shadow-sm">
                        <h5 class="fw-bold">Acciones Finales</h5>
                        <p class="small text-muted mb-3">Al confirmar, se descontará el stock y se registrará el alquiler en el sistema.</p>
                        
                        <button class="btn w-100 mb-2 fw-bold text-white" 
                                onclick="procesarAlquiler()" 
                                style="background-color: #0056b3; border: none; padding: 12px; border-radius: 8px; transition: 0.3s; font-family: inherit;"
                                onmouseover="this.style.background='#198754'; this.style.transform='scale(1.02)'"
                                onmouseout="this.style.background='#0056b3'; this.style.transform='scale(1)'">
                             CONFIRMAR Y GENERAR ACTA
                        </button>
                        
                        <a href="inventario.html" 
                           class="btn btn-sm w-100 fw-bold d-flex align-items-center justify-content-center" 
                           style="background: white; color: #dc3545; border: 2px solid #dc3545; padding: 10px; border-radius: 8px; text-decoration: none; transition: 0.3s; font-family: inherit;"
                           onmouseover="this.style.background='#dc3545'; this.style.color='white'"
                           onmouseout="this.style.background='white'; this.style.color='#dc3545'">
                            Regresar al Inventario
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuevoCliente" tabindex="-1" aria-labelledby="modalNuevoClienteLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white py-2">
                    <h5 class="modal-title fs-6 fw-bold" id="modalNuevoClienteLabel">Registro de Cliente Nuevo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formClienteRapido">
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Nombre Completo *</label>
                            <input type="text" id="m-nombre" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Cédula / RUC *</label>
                            <input type="text" id="m-cedula" class="form-control form-control-sm" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Teléfono</label>
                                <input type="text" id="m-telefono" class="form-control form-control-sm">
                            </div>
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Correo</label>
                                <input type="email" id="m-correo" class="form-control form-control-sm">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success btn-sm w-100 fw-bold mt-2" style="background-color: #198754; border: none; padding: 10px;">
                            GUARDAR Y SELECCIONAR
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/resumen-alquiler.js"></script>
</body>
</html>
